      const drawImageToCanvas = (img, canvas) => {
        const ctx = canvas.getContext('2d');
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, w, h);
      };

      function makeEvenLines(size, count) {
        const lines = [];
        for (let i = 0; i <= count; i++) {
          lines.push(Math.round((i * size) / count));
        }
        return lines;
      }

      // OCR / Image Processing Functions (Simplified/Retained for Image flow)
      // Note: Warped/Threshold steps are removed from UI but logic is kept if needed for OCR, 
      // though without canvases they can't be debugged easily. 
      // For this refactor, we focus on the URL loading part.



      async function handlePzprUrl(url) {
        setStatus('Loading puzzle from URL...');
        pzprDiv.style.display = 'block';
        orig.style.display = 'none';
        pzprSolution.style.display = 'block';
        solution.style.display = 'none';
        pzprDiv.innerHTML = ''; // Clear previous
        debugArea.textContent += 'Starting load...\n';

        const log = (msg) => {
          console.log(msg);
          debugArea.textContent += msg + '\n';
        };

        try {
          if (!window.pzpr) throw new Error('pzpr.js not loaded');
          log('pzpr version: ' + pzpr.version);

          // Check varieties
          const varieties = Object.keys(pzpr.variety.info || {});
          log('Loaded varieties count: ' + varieties.length);
          if (pzpr.variety.info.nurimisaki) {
            log('nurimisaki is supported');
          } else {
            log('nurimisaki NOT found');
            log('First 5 varieties: ' + varieties.slice(0, 5).join(', '));
          }

          // Extract data part from URL (after ?)
          const parts = url.split('?');
          const data = parts.length > 1 ? parts[1] : url;
          //const data = url;

          log('Opening puzzle with data: ' + data.substring(0, 50) + '...');

          const puzzle = new pzpr.Puzzle();
          const puzzleSolution = new pzpr.Puzzle();

          const timeout = setTimeout(() => {
            setStatus('Error: Puzzle load timed out.');
            log('Puzzle load timed out');
          }, 5000);

          puzzle.open(data, () => {
            clearTimeout(timeout);
            log('Puzzle opened callback fired.');
            // setCanvas expects the DOM element, not an id string
            puzzle.setCanvas(pzprDiv);
            puzzle.setCanvasSize(pzprDiv.clientWidth, pzprDiv.clientHeight);
            // Make the rendered puzzle view-only
            pzprDiv.style.pointerEvents = 'none';
            // Use play mode and clear any selection cursor
            if (puzzle.setMode) puzzle.setMode('play');
            if (puzzle.cursor && puzzle.cursor.reset) puzzle.cursor.reset();
            puzzle.redraw();
            log('Redraw called.');

            // Also load puzzle on solution div
            puzzleSolution.open(data, () => {
              log('Solution puzzle opened callback fired.');
              puzzleSolution.setCanvas(pzprSolution);
              puzzleSolution.setCanvasSize(pzprSolution.clientWidth, pzprSolution.clientHeight);
              pzprSolution.style.pointerEvents = 'none';
              if (puzzleSolution.setMode) puzzleSolution.setMode('play');
              if (puzzleSolution.cursor && puzzleSolution.cursor.reset) puzzleSolution.cursor.reset();
              puzzleSolution.redraw();
              log('Solution div redraw called.');
            });

            // Analyze SVG
            setTimeout(() => {
              const svg = pzprDiv.querySelector('svg');
              if (svg) {
                // Hide cursor rectangles that may remain after reset
                const style = document.createElement('style');
                style.textContent = 'rect.cursor, rect#cursor { display: none !important; }';
                svg.appendChild(style);
                setStatus('Puzzle loaded. SVG found.');
                log('SVG found.');
                analyzeSvg(svg);
              } else {
                setStatus('Puzzle loaded but no SVG found.');
                log('No SVG element found.');
              }
            }, 500);
          });
          pzprPuzzle = puzzle;
        } catch (e) {
          setStatus('Error loading puzzle: ' + e.message);
          log('Error: ' + e.message);
          console.error(e);
        }
      }

      function analyzeSvg(svg) {
        const circles = [];
        const texts = [];
        const paths = [];
        const dashVertical = [];
        const dashHorizontal = [];

        const isCirclePath = (node) => {
          if (node.tagName !== 'path') return false;
          const d = node.getAttribute('d') || '';
          const fill = (node.getAttribute('fill') || '').toLowerCase();
          const stroke = (node.getAttribute('stroke') || '').toLowerCase();
          return d.includes('A') && (fill === 'white' || stroke === 'black' || stroke === '#000000');
        };

        const addCircleFromPath = (node) => {
          const bbox = node.getBBox();
          //console.log('Circle path bbox:', bbox);
          const cx = bbox.x + bbox.width / 2;
          const cy = bbox.y + bbox.height / 2;
          const r = Math.max(bbox.width, bbox.height) / 2;
          circles.push({
            tag: 'circlePath',
            cx,
            cy,
            r,
            fill: node.getAttribute('fill'),
            stroke: node.getAttribute('stroke'),
            strokeWidth: node.getAttribute('stroke-width')
          });
        };

        function traverse(node) {
          if (node.tagName === 'text') {
            texts.push({
              tag: 'text',
              x: parseFloat(node.getAttribute('x')),
              y: parseFloat(node.getAttribute('y')),
              content: node.textContent.trim()
            });
          } else if (isCirclePath(node)) {
            addCircleFromPath(node);
          } else if (node.tagName === 'circle') {
            circles.push({
              tag: 'circle',
              cx: parseFloat(node.getAttribute('cx')),
              cy: parseFloat(node.getAttribute('cy')),
              r: parseFloat(node.getAttribute('r')),
              fill: node.getAttribute('fill'),
              stroke: node.getAttribute('stroke'),
              strokeWidth: node.getAttribute('stroke-width')
            });
          } else if (node.tagName === 'path') {
            const dash = node.getAttribute('stroke-dasharray');
            // Capture dashed grid lines
            if (dash && dash.toLowerCase() !== 'none') {
              const dAttr = node.getAttribute('d') || '';
              const match = /M\s*([-\d.]+)\s+([-\d.]+)\s+L\s+([-\d.]+)\s+([-\d.]+)/i.exec(dAttr);
              if (match) {
                const x1 = parseFloat(match[1]), y1 = parseFloat(match[2]);
                const x2 = parseFloat(match[3]), y2 = parseFloat(match[4]);
                const dx = Math.abs(x2 - x1);
                const dy = Math.abs(y2 - y1);
                if (dx < dy) {
                  const x = (x1 + x2) / 2;
                  dashVertical.push(x);
                } else {
                  const y = (y1 + y2) / 2;
                  dashHorizontal.push(y);
                }
              } else {
                // Fallback to bbox orientation
                const bb = node.getBBox();
                if (bb.width < bb.height) {
                  dashVertical.push(bb.x + bb.width / 2);
                } else {
                  dashHorizontal.push(bb.y + bb.height / 2);
                }
              }
            }
            paths.push({
              tag: 'path',
              d: node.getAttribute('d'),
              fill: node.getAttribute('fill'),
              stroke: node.getAttribute('stroke'),
              strokeWidth: node.getAttribute('stroke-width')
            });
          }

          for (let i = 0; i < node.children.length; i++) traverse(node.children[i]);
        }

        traverse(svg);

        // Merge circle pairs (fill + stroke) that share the same center
        const mergedCircles = [];
        const tol = 1; // pixels
        circles.forEach(c => {
          const existing = mergedCircles.find(m => Math.hypot(m.cx - c.cx, m.cy - c.cy) <= tol);
          if (existing) {
            existing.r = Math.max(existing.r, c.r);
            existing.fill = existing.fill || c.fill;
            existing.stroke = existing.stroke || c.stroke;
          } else {
            mergedCircles.push({ ...c });
          }
        });

        // Attach nearest text to circle if inside (within radius * 1.3)
        const numberedCircles = mergedCircles.map(c => {
          let best = null;
          let bestDist = Infinity;
          texts.forEach(t => {
            const d = Math.hypot(t.x - c.cx, t.y - c.cy);
            if (d < bestDist) {
              best = t;
              bestDist = d;
            }
          });
          const inside = best && bestDist <= c.r * 1.3;
          return { ...c, text: inside ? best.content : null };
        });
        //get cell width and height
        const cellWidth = dashVertical.length > 1 ? dashVertical[1] - dashVertical[0] : null;
        const cellHeight = dashHorizontal.length > 1 ? dashHorizontal[1] - dashHorizontal[0] : null;

        const rows = dashHorizontal.length > 1 ? dashHorizontal.length + 1 : null;
        const cols = dashVertical.length > 1 ? dashVertical.length + 1 : null;
        //init grid as cellWidth x cellHeight array ;
        grid = Array(cols).fill(null).map(() => Array(rows).fill('.'));

        //in #solution add div for every cell and set it as display:none
        const solutionDiv = document.getElementById('pzpr-solution');
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cellDiv = document.createElement('div');
            cellDiv.id = `cell-${c}-${r}`;
            cellDiv.className = 'svgblock';
            cellDiv.style.display = 'none';
            solutionDiv.appendChild(cellDiv);
            //set it position absolute
            cellDiv.style.position = 'absolute';
            cellDiv.style.left = `${cellWidth * c + 10}px`;
            cellDiv.style.top = `${cellHeight * r + 10}px`;
            cellDiv.style.width = `${cellWidth || 40}px`;
            cellDiv.style.height = `${cellHeight || 40}px`;
          }
        }




        //for each numberedCircles, calculate cell position
        numberedCircles.forEach((c, i, arr) => {
          if (cellWidth && cellHeight) {
            const col = Math.floor((c.cx) / cellWidth);
            const row = Math.floor((c.cy) / cellHeight);
            //delete all attribute in c
            c.cell = { col, row };
            grid[col][row] = -1;
            arr[i] = {
              tag: c.tag,
              cell: { col, row },
            };


          } else {
            c.cell = null;
          }
        });

        //for each texts without circle, calculate cell position
        texts.forEach((t, i, arr) => {
          if (cellWidth && cellHeight) {
            const col = Math.floor((t.x) / cellWidth);
            const row = Math.floor((t.y) / cellHeight);
            const parsed = parseInt(t.content, 10);
            grid[col][row] = Number.isNaN(parsed) ? t.content : parsed;
            arr[i] = {
              tag: t.tag,
              text: parsed,
              cell: { col, row },
            };
          } else {
            t.cell = null;
          }
        });
        //clone grid to init_grid
        init_grid = grid.map(row => row.slice());
        console.log("init_grid=" + JSON.stringify(init_grid));
        const analysis = {
          type: 'svg',
          //width: svg.getAttribute('width'),
          //height: svg.getAttribute('height'),
          circles: numberedCircles,
          texts,
          /*grid: {
            vertical: dashVertical.sort((a, b) => a - b),
            horizontal: dashHorizontal.sort((a, b) => a - b)
          },*/
          rows: rows,
          cols: cols,
          //pathsCount: paths.length
        };

        debugArea.textContent += JSON.stringify(analysis, null, 2);
        const text = grid.map(row => row.join('')).join('\r\n');
        debugArea.textContent += text;
      }

      document.getElementById('loadUrl').addEventListener('click', () => {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;

        if (url.includes('pzv.jp') || url.includes('nurimisaki')) {

              svgblock.style.color = 'black'

          }

        }


        const ROW_SIZE = grid.length;

        text += divider + '<br/>'

          for (var j = 0; j < COL_SIZE; j++) {
            text += '|';
            var mid = grid[j][i];
            if (mid == ".")
              text += '&nbsp; ' + '?' + ' &nbsp;';
            else if (mid == -1)
              text += '&nbsp; ' + 'O' + ' &nbsp;';
            else
              text += '&nbsp; ' + mid + ' &nbsp;';
          }
          text += '|<br/>' + divider + '<br/>'
        }
        var apad = document.getElementById('apad');
        apad.innerHTML = text;
        return text;
      }



      function runCSP(grid, rows, cols) {

        // The previous file had runCSP defined inside the IIFE. I must include it.

        const variables = {};
        const constraints = [];
        for (let r = 0; r < rows; r++) {

            if (cell > 0 || cell === -1) variables[`${c},${r}`] = [1];
            else variables[`${c},${r}`] = [0, 1]; //1 for white , 0 for black

            debugArea.textContent += 'No solution found.';

            setStatus('Solved!');
            
            debugArea.textContent = '\n\nSolution:\n' + JSON.stringify(result, null, 2);
            debugArea.textContent += '\n\nTotal steps: ' + vis_count + '\n';
            //drawSolution(result, grid, rows, cols);

          }
        } catch (e) {
          setStatus('Error: ' + e.message);
        }
      }
//print assign

      function validateNuri(assigned, unassigned, grid, rows, cols) {
        // ... (Existing validation logic)
        // I will copy the validation logic from the previous file to ensure it works.
        // For brevity in this thought process, I'll ensure the replacement content has the full logic.
        // See actual replacement content below.
        let localgrid = [];
        localgrid = Array(cols).fill(null).map(() => Array(rows).fill('.'));  // [x][y] = [cols][rows]
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = init_grid[c][r];
            //if (cell.type === 'number' || cell.type === 'circle') variables[`${r},${c}`] = [1];
            if (cell > 0 || cell === -1) 
              assigned[`${c},${r}`]=[1];
              //assigned.push([`${c},${r}`],[1]);
          }
        }
        /*
        assigned['0,0']=[0];
        assigned['2,0']=[1];
        assigned['3,0']=[1];
        assigned['4,0']=[1];
        assigned['5,0']=[1];
        assigned['6,0']=[1];
        assigned['0,1']=[0];
        assigned['1,1']=[0];
        assigned['2,1']=[1];
        assigned['3,1']=[0];
        assigned['5,1']=[0];
        assigned['6,1']=[0];
        assigned['7,1']=[0];*/
        
        for (const key in assigned) {

          var solution = assigned[key][0];
          //console.log(key+" = "+solution);
          //debugArea.textContent += key+" = "+solution + '\n';
          //solution = c,r
          var parts = key.split(',');
          var x = parts[0];
          var y = parts[1];

          if (solution == 1) {
            //localgrid[x][y] = 'init_grid[x][y]';
          }
          else {
            localgrid[x][y] = 'B';
          }

        }
        console.log("=========")
        debugArea.textContent += "======================\n"

        //print grid
        //console.log("Validating... grid=" + JSON.stringify(localgrid));

        const getVal = (c, r) => {
          if (r < 0 || r >= rows || c < 0 || c >= cols) return 0;
          const key = `${c},${r}`;
          if (assigned[key] !== undefined) return assigned[key][0];
          return null;
        };
        const printAssign = () => {

            if (v1 !== null && v2 !== null && v3 !== null && v4 !== null) {
              const sum = v1 + v2 + v3 + v4;

                console.log(`======================2x2 violation at ${c},${r} with values ${v1},${v2},${v3},${v4}`);

                console.log(`3=====================Cell at ${c},${r} cannot reach 1 white neighbor: white=${white}, pot=${pot}`);
                debugArea.textContent += `Cell at ${c},${r} cannot reach 1 white neighbor: white=${white}, pot=${pot}\n`;
                return false;
              }
              if (pot === 0 && white !== 1)
              {
                console.log(`4=====================Cell at ${c},${r} has no potential neighbors but white=${white}`);
                debugArea.textContent += `Cell at ${c},${r} has no potential neighbors but white=${white}\n`;
                return false;
              }

              if (debug == 1) {
                dbg_log += `At cell ${c},${r} with cell=${cell}, white=${white}, pot=${pot}\n`;
//                console.log(`At cell ${c},${r} with cell=${cell}, white=${white}, pot=${pot}`);
              }
            }
            else if (val == 1){//(cell !== 'B') {
              if (white + pot < 2)        // 就算未來全變白也湊不到 2
              {
                console.log(`5=====================White cell at ${c},${r} cannot reach 2 white neighbors: white=${white}, pot=${pot}`);
                debugArea.textContent += `White cell at ${c},${r} cannot reach 2 white neighbors: white=${white}, pot=${pot}\n`;
                return false;
              }
            }
            if (cell > 0 && white === 1) {
              //set other direction to black
              for (const n of neighbors) {
                if (n.c === nc && n.r === nr) continue;
                const nv = getVal(n.c, n.r);
                if (nv === 1) 
                {
                console.log(`6=====================Cell at ${c},${r} has multiple white neighbors when length=${cell}`);
                debugArea.textContent += `Cell at ${c},${r} has multiple white neighbors when length=${cell}\n`;
                return false;
                }

              }
              // Number logic (simplified for length)

              let length = cell;
              //use nc,nr c r to trace the line
              const dx = nc - c;
              const dy = nr - r;
              if (Math.abs(dx) + Math.abs(dy) !== 1) 
              {
                console.log(`7=====================Cell at ${c},${r} has non-adjacent white neighbor at ${nc},${nr}`);
                debugArea.textContent += `Cell at ${c},${r} has non-adjacent white neighbor at ${nc},${nr}\n`;
                return false;
              }
              for (let step = 1; step < length; step++) {
                const currR = r + dy * step;
                const currC = c + dx * step;
                const currVal = getVal(currC, currR);
                if (currVal === null) break; //undecided
                if (currVal === 0) 
                {
                  console.log(`8=====================Cell at ${c},${r} line blocked at ${currC},${currR} before reaching length ${length}`);
                  debugArea.textContent += `Cell at ${c},${r} line blocked at ${currC},${currR} before reaching length ${length}\n`;
                  return false;
                }
                //advance
              }
              const endR = r + dy * (length-1);
              const endC = c + dx * (length-1);
              if (endR < 0 || endR >= rows || endC < 0 || endC >= cols) 
              {
                console.log(`9=====================Cell at ${c},${r} line goes out of bounds at ${endC},${endR}`);
                debugArea.textContent += `Cell at ${c},${r} line goes out of bounds at ${endC},${endR}\n`;
                return false;
              }
              const endVal = getVal(endC+dx, endR+dy);

              if (endVal === 1)  //end on white
              {
                console.log(`10=====================Cell at ${c},${r} line ends on white cell at ${endC},${endR}`);
                debugArea.textContent += `Cell at ${c},${r} line ends on white cell at ${endC},${endR}\n`;
                return false;
              }
              //const nkey = `${endC},${endR}`;
              //assigned[nkey] = [0]; //set to black

            }
          }
        }

        // 3. Connectivity Check (Relaxed for partial assignments)
        let targets = []; // Cells that MUST be connected
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = getVal(c, r);
            const isCircle = localgrid[c][r] === -1;
            const isAssignedWhite = val === 1 && !isCircle;

            if (isCircle || isAssignedWhite) {
              targets.push({ c, r, isCircle });
            }
          }
        }

        if (targets.length === 0) return true;

        // BFS Initialization
        const visited = Array.from({ length: cols }, () => Array(rows).fill(false)); // [x][y]
        const queue = [];

        // Start BFS from the first target's accessible stream cells
        const startNode = targets[0];
        if (startNode.isCircle) {
          // Add all valid neighbors of the circle to queue
          const neighbors = [{ c: startNode.c - 1, r: startNode.r }, { c: startNode.c + 1, r: startNode.r }, { c: startNode.c, r: startNode.r - 1 }, { c: startNode.c, r: startNode.r + 1 }];
          for (const n of neighbors) {
            if (n.c >= 0 && n.c < cols && n.r >= 0 && n.r < rows) {
              const nVal = getVal(n.c, n.r);
              const nIsCircle = localgrid[n.c][n.r] === -1;
              // Can traverse if not Black and not Circle
              if (nVal !== 0 && !nIsCircle) {
                if (!visited[n.c][n.r]) {
                  visited[n.c][n.r] = true;
                  queue.push(n);
                }
              }
            }
          }
        } else {
          // StartNode is a Stream cell
          visited[startNode.c][startNode.r] = true;
          queue.push({ c: startNode.c, r: startNode.r });
        }

        // Run BFS on the "Stream" (White + Unassigned, excluding Circles)
        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        while (queue.length > 0) {
          const { c, r } = queue.shift();

          for (const [dc, dr] of dirs) {
            const nc = c + dc;
            const nr = r + dr;
            if (nc >= 0 && nc < cols && nr >= 0 && nr < rows) {
              const nVal = getVal(nc, nr);
              const nIsCircle = localgrid[nc][nr] === -1;

              // Traverse if not Black and not Circle
              if (nVal !== 0 && !nIsCircle && !visited[nc][nr]) {
                visited[nc][nr] = true;
                queue.push({ c: nc, r: nr });
              }
            }
          }
        }

        // Verify all targets are connected
        for (const t of targets) {
          if (t.isCircle) {
            // A circle is connected if ANY of its neighbors are visited
            const neighbors = [{ c: t.c - 1, r: t.r }, { c: t.c + 1, r: t.r }, { c: t.c, r: t.r - 1 }, { c: t.c, r: t.r + 1 }];
            let connected = false;
            for (const n of neighbors) {
              if (n.c >= 0 && n.c < cols && n.r >= 0 && n.r < rows) {
                if (visited[n.c][n.r]) {
                  connected = true;
                  break;
                }
              }
            }
            if (!connected) return false;
          } else {
            // Stream cell must be visited
            if (!visited[t.c][t.r]) return false;
          }
        }

        return true;
      }
    })();
  </script>
